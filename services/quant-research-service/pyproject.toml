[project]
name = "quant-research-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.37,<2",
    "fastapi>=0.115,<1",
    "lightgbm>=4.6,<5",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=19,<23",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pyqlib>=0.9.6,<0.10",
    "uvicorn[standard]>=0.34,<1",
]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]
[tool.ruff]
line-length = 100
[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["boto3.session", "pyarrow", "pyarrow.*", "qlib", "qlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
