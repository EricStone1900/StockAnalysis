[project]
name = "quant-research-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic>=2.10"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]
[tool.ruff]
line-length = 100
[tool.mypy]
strict = true
