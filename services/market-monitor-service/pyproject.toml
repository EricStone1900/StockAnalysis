[project]
name = "market-monitor-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2.10"]

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]

[tool.ruff]
line-length = 100
[tool.mypy]
strict = true
[tool.pytest.ini_options]
pythonpath = ["."]
