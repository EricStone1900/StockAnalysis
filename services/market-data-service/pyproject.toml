[project]
name = "market-data-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "pydantic>=2.10", "pyarrow>=19.0", "psycopg[binary]>=3.2", "boto3>=1.37", "nats-py>=2.10", "baostock>=0.8.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]

[tool.ruff]
line-length = 100
[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.parquet", "boto3.session", "baostock"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
