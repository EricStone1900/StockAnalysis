name: stock-analysis-infra

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports: ["5433:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-services.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD_FILE: /run/secrets/temporal_postgres_password
      POSTGRES_DB: temporal
    secrets: [temporal_postgres_password]
    volumes: [temporal-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal-postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
    secrets: [temporal_postgres_password]
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        export POSTGRES_PWD="$(cat /run/secrets/temporal_postgres_password)";
        exec /etc/temporal/entrypoint.sh autosetup
    ports: ["7233:7233"]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: [nats-data:/data]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets: [minio_root_password]
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["../otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]

  market-data-service:
    build:
      context: ../..
      dockerfile: services/market-data-service/Dockerfile
    environment:
      MARKET_DATA_DATABASE_URL: postgresql://market_data:market_data_local_only@postgres:5432/market_data
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_root_password
      ARTIFACT_BUCKET: artifacts
      NATS_URL: nats://nats:4222
      MARKET_DATA_IMPORT_TOKEN: ${MARKET_DATA_IMPORT_TOKEN:-}
      BAOSTOCK_MAX_ATTEMPTS: ${BAOSTOCK_MAX_ATTEMPTS:-3}
      BAOSTOCK_INITIAL_BACKOFF_SECONDS: ${BAOSTOCK_INITIAL_BACKOFF_SECONDS:-1}
      BAOSTOCK_MIN_INTERVAL_SECONDS: ${BAOSTOCK_MIN_INTERVAL_SECONDS:-0.2}
      BAOSTOCK_QUERY_TIMEOUT_SECONDS: ${BAOSTOCK_QUERY_TIMEOUT_SECONDS:-30}
    secrets: [minio_root_password]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
      nats: { condition: service_started }
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:3000/live')"]
      interval: 5s
      timeout: 3s
      retries: 20

  quant-research-service:
    build:
      context: ../..
      dockerfile: services/quant-research-service/Dockerfile
    environment:
      QUANT_RESEARCH_DATABASE_URL: postgresql://quant_research:quant_research_local_only@postgres:5432/quant_research
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY_FILE: /run/secrets/minio_root_password
      ARTIFACT_BUCKET: artifacts
    secrets: [minio_root_password]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_started }
    ports: ["3001:3000"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:3000/live')"]
      interval: 5s
      timeout: 3s
      retries: 20

secrets:
  postgres_password: { file: ./secrets/postgres_password }
  temporal_postgres_password: { file: ./secrets/temporal_postgres_password }
  minio_root_password: { file: ./secrets/minio_root_password }

volumes:
  postgres-data:
  temporal-postgres-data:
  nats-data:
  redis-data:
  minio-data:
